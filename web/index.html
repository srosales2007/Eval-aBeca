<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EvalúaBeca</title>
  <link rel="stylesheet" href="/static/estilos.css">
</head>
<body>
  <header class="barra">
    <h1>EvalúaBeca</h1>
    <span class="subtitulo">Motor híbrido de evaluación de solicitudes de beca</span>
  </header>

  <main class="contenedor">
    <section class="tarjeta">
      <h2>Nueva solicitud</h2>
      <form id="form-solicitud" novalidate>
        <div class="fila">
          <label>Carné <input name="carne" required pattern="[A-Za-z0-9-]{4,15}" placeholder="FI-2026-0145"></label>
          <label>Nombre completo <input name="nombre" required minlength="3" placeholder="Ana Mora Solís"></label>
        </div>
        <label>Carrera <input name="carrera" required minlength="3" placeholder="Desarrollo de Software"></label>
        <div class="fila">
          <label>Promedio (0-100) <input name="promedio" type="number" step="0.01" min="0" max="100" required></label>
          <label>Materias matriculadas <input name="materias" type="number" min="1" max="8" required></label>
        </div>
        <div class="fila">
          <label>Ingreso mensual del hogar (₡) <input name="ingreso_hogar" type="number" min="0" required></label>
          <label>Miembros del hogar <input name="miembros_hogar" type="number" min="1" max="20" required></label>
        </div>
        <p class="ayuda" id="ingreso-pc">Ingreso per cápita: —</p>
        <fieldset>
          <legend>Condiciones especiales</legend>
          <label class="check"><input type="checkbox" name="condiciones" value="discapacidad"> Discapacidad</label>
          <label class="check"><input type="checkbox" name="condiciones" value="jefe_de_hogar"> Jefe(a) de hogar</label>
          <label class="check"><input type="checkbox" name="condiciones" value="zona_vulnerable"> Zona vulnerable</label>
          <label class="check"><input type="checkbox" name="condiciones" value="primera_generacion"> Primera generación universitaria</label>
        </fieldset>
        <button type="submit" id="btn-evaluar">Evaluar solicitud</button>
        <p class="error" id="error-form" hidden></p>
      </form>
    </section>

    <section class="tarjeta" id="panel-resultado" hidden>
      <h2>Dictamen</h2>
      <div id="resultado"></div>
    </section>

    <section class="tarjeta ancho">
      <h2>Historial de solicitudes</h2>
      <table>
        <thead><tr><th>ID</th><th>Estudiante</th><th>Promedio</th><th>Dictamen</th><th>Beca</th><th>Fecha</th></tr></thead>
        <tbody id="tabla-historial"><tr><td colspan="6" class="vacio">Sin solicitudes todavía</td></tr></tbody>
      </table>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
